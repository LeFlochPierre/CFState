name: CF-State source regression

on:
  push:
    branches:
      - main
      - refactor/clean-cfstate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-math-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source (no local datasets)
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Run offline numerical and provenance tests
        run: python workflows/verify.py
